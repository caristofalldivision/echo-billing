<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- floating router -->
  <g transform="translate(300,180)">
    <path d="M-70 40 Q-72 0 -30 -4 L30 -4 Q72 0 70 40 Q72 70 30 74 L-30 74 Q-72 70 -70 40 Z"
          fill="#FFFFFF" stroke="#241A15" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M-30 -4 L-22 -34" stroke="#241A15" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M30 -4 L22 -34" stroke="#241A15" stroke-width="3.5" stroke-linecap="round"/>
    <circle cx="-30" cy="35" r="6" fill="#1F6F68"/>
    <circle cx="-8" cy="35" r="6" fill="#E0A53C"/>
    <circle cx="14" cy="35" r="6" fill="#5B5FEF"/>
    <!-- wifi ripples -->
    <path d="M-10 -55 Q0 -70 10 -55" stroke="#5B5FEF" stroke-width="4" stroke-linecap="round"/>
    <path d="M-22 -66 Q0 -92 22 -66" stroke="#C1502E" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M-34 -78 Q0 -114 34 -78" stroke="#E0A53C" stroke-width="4" stroke-linecap="round" opacity="0.45"/>
  </g>

  <!-- phone with a person -->
  <g transform="translate(560,260)">
    <path d="M-2 -60 Q40 -60 42 -20 L42 60 Q40 100 -2 100 Q-44 100 -46 60 L-46 -20 Q-44 -60 -2 -60 Z"
          fill="#FFFFFF" stroke="#241A15" stroke-width="3.5"/>
    <rect x="-30" y="-38" width="52" height="98" rx="10" fill="#F4E9D6" stroke="#241A15" stroke-width="2.5"/>
    <path d="M-16 -6 Q-4 -22 8 -6" stroke="#5B5FEF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="-4" cy="18" r="10" fill="#C1502E" opacity="0.85"/>
    <path d="M-16 44 Q-4 34 8 44" stroke="#E0A53C" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- hand-drawn diamond motifs, kente/mudcloth-inspired -->
  <g stroke-width="2.5" stroke-linejoin="round" fill="none" opacity="0.5">
    <path d="M130 110 l14 -14 l14 14 l-14 14 Z" stroke="#C1502E"/>
    <path d="M685 140 l11 -11 l11 11 l-11 11 Z" stroke="#1F6F68"/>
    <path d="M105 415 l12 -12 l12 12 l-12 12 Z" stroke="#E0A53C"/>
    <path d="M715 400 l10 -10 l10 10 l-10 10 Z" stroke="#5B5FEF"/>
  </g>

  <!-- scattered doodle dots -->
  <circle cx="660" cy="90" r="5" fill="#E0A53C"/>
  <circle cx="150" cy="330" r="4" fill="#5B5FEF"/>
  <circle cx="740" cy="360" r="6" fill="#1F6F68" opacity="0.7"/>

  <!-- hand-drawn wavy ground lines -->
  <path d="M0 520 Q50 500 100 520 T200 520 T300 520 T400 520 T500 520 T600 520 T700 520 T800 520"
        stroke="#5B5FEF" stroke-width="3" fill="none" opacity="0.22" stroke-linecap="round"/>
  <path d="M0 560 Q60 545 120 560 T240 560 T360 560 T480 560 T600 560 T720 560 T800 560"
